[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moyu-memory"
version = "2.7.1"
description = "Zero-trust memory toolkit for AI Agents. Pure Python, zero infrastructure, self-defending."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["ai-agent", "memory", "toolkit", "zero-trust", "python", "llm"]

authors = [
    {name = "mianlou"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.5.4"]
encryption = ["cryptography>=44.0.1"]

[project.urls]
Homepage = "https://github.com/awchzh/moyu-memory"
Repository = "https://github.com/awchzh/moyu-memory"

[project.scripts]
moyu = "moyu_toolkit.moyu:main_cli"

[tool.setuptools.packages.find]
include = ["moyu_toolkit*", "moyu*"]
exclude = ["moyu_toolkit.墨羽项目"]

[tool.setuptools.package-data]
"moyu_toolkit" = ["*.yaml", "*.json", "*.md", "*.txt"]
"moyu_toolkit.defense_toolkit" = ["*.json"]
"moyu_toolkit.tests" = ["*.py"]

[tool.setuptools.exclude-package-data]
"moyu_toolkit" = ["墨羽项目.md", "SKILL.md"]
